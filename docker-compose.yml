services:
  recommendarr:
    image: slimjimserver/recommendarr:latest
    container_name: recommendarr
    restart: unless-stopped
    # Run with your host user's IDs so bind-mounted files stay writable.
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
    volumes:
      # Application configuration plus persistent data, exports, and logs.
      - ./config:/app
